name: Build StudyMate APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'StudyMate-v0.3.1-source.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract StudyMate source
        run: |
          mkdir source
          unzip StudyMate-v0.3.1-source.zip -d source

      - name: Locate project
        run: |
          PROJECT_DIR=$(dirname "$(find source -name settings.gradle -print -quit)")
          if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "Could not locate the StudyMate Android project"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Fix Kotlin compiler compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          project = Path(os.environ["PROJECT_DIR"])
          root = project / "build.gradle"
          app = project / "app" / "build.gradle"

          root_text = root.read_text()
          root_text, count = re.subn(
              r"""id\s+['"]com\.android\.application['"]\s+version\s+['"]9\.5\.0['"]\s+apply\s+false""",
              "id 'com.android.application' version '8.13.2' apply false\n"
              "    id 'org.jetbrains.kotlin.android' version '2.4.0' apply false",
              root_text,
              count=1,
          )
          if count != 1:
              raise SystemExit("Expected AGP 9.5.0 declaration not found.")
          root.write_text(root_text)

          app_text = app.read_text()
          if "id 'org.jetbrains.kotlin.android'" not in app_text:
              app_text, count = re.subn(
                  r"""(plugins\s*\{\s*id\s+['"]com\.android\.application['"]\s*)\}""",
                  r"\1    id 'org.jetbrains.kotlin.android'\n}",
                  app_text,
                  count=1,
              )
              if count != 1:
                  raise SystemExit("Could not safely update app plugins block.")

          if "kotlin {" not in app_text:
              marker = re.search(r"(?m)^dependencies\s*\{", app_text)
              if not marker:
                  raise SystemExit("Could not find dependencies block.")
              config = (
                  "kotlin {\n"
                  "    compilerOptions {\n"
                  "        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17\n"
                  "    }\n"
                  "}\n\n"
              )
              app_text = app_text[:marker.start()] + config + app_text[marker.start():]

          app.write_text(app_text)
          print("Kotlin compatibility configuration applied.")
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Verify APK exists
        run: |
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK" || { echo "APK was not generated"; exit 1; }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StudyMate-debug-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          
