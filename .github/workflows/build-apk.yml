name: Build StudyMate APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'StudyMate-v0.3.0-source.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract StudyMate source
        run: |
          mkdir source
          unzip StudyMate-v0.3.0-source.zip -d source

      - name: Locate project
        run: |
          PROJECT_DIR=$(dirname "$(find source -name settings.gradle -print -quit)")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Adjust project SDK version
        run: |
          python3 - "$PROJECT_DIR/app/build.gradle" <<'PY'
          import re
          import sys
          from pathlib import Path

          p = Path(sys.argv[1])
          s = p.read_text()

          for key in ("compileSdk", "targetSdk"):
              s, count = re.subn(
                  rf'(\b{key}(?:Version)?\s*=?\s*)37\b',
                  r'\g<1>36',
                  s,
                  count=1
              )
              if count != 1:
                  raise SystemExit(f"Could not find {key} version 37")

          p.write_text(s)
          print("Project SDK versions changed to 36")

          PY
      - name: Remove redundant Kotlin plugin
        run: |
          sed -i "/org.jetbrains.kotlin.android/d" "$PROJECT_DIR/app/build.gradle"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StudyMate-debug-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          
